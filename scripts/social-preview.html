<!doctype html>
<!-- GitHub's social preview card (Settings → Social preview). Regenerate the PNG with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1280,640 --screenshot=docs/images/social-preview.png scripts/social-preview.html
     The story in one picture: the screenshot you take (a real selection, with its size readout), then the answer. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #e4e7eb; color: #1c1e21;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    padding: 60px 64px; box-sizing: border-box;
    display: grid; grid-template-columns: 520px 1fr; grid-template-rows: auto auto; align-content: center;
    column-gap: 52px; row-gap: 56px;
  }
  header { grid-column: 1 / -1; }
  h1 { margin: 0 0 18px; font: 400 60px/1 Silkscreen, monospace; letter-spacing: 2px; }
  header p { margin: 0; font-size: 29px; line-height: 1.25; color: #3d4248; }

  /* left: what you screenshot. macOS dims everything outside the selection while you drag */
  .take { align-self: center; }
  .shot { position: relative; }  /* the selection and its size readout are placed against the screenshot */
  .frame { position: relative; overflow: hidden; border-radius: 7px; }
  .frame img { display: block; width: 100%; }
  .sel { position: absolute; left: 1.5%; top: 6%; width: 77%; height: 62%; outline: 1.5px dashed #fff; box-shadow: 0 0 0 999px rgba(20, 22, 25, .55); }
  .size {
    position: absolute; left: calc(1.5% + 77%); top: calc(6% + 62% + 8px); transform: translateX(-100%);
    font: 500 15px/1 -apple-system, sans-serif; font-variant-numeric: tabular-nums;
    color: #fff; background: rgba(28, 30, 33, .85); padding: 5px 8px; border-radius: 4px;
  }
  .keys { margin: 30px 0 0; font-size: 22px; color: #3d4248; }
  kbd { font: 600 19px/1 -apple-system, sans-serif; padding: 4px 9px; border: 1px solid #b9bfc6; border-bottom-width: 2px; border-radius: 6px; background: #f6f7f8; color: #1c1e21; }

  /* right: the answer, in your terminal */
  .get { width: 100%; border-radius: 10px; box-shadow: 0 18px 40px rgba(28, 30, 33, .28); align-self: center; }
</style>
</head>
<body>
  <header>
    <h1>Fixel</h1>
    <p>Screenshot what you're stuck on. Read the fix in your terminal.</p>
  </header>
  <div class="take">
    <div class="shot">
      <div class="frame"><img src="../tests/fixtures/pandas-error.png" alt=""><div class="sel"></div></div>
      <span class="size">693 × 136</span>
    </div>
    <p class="keys"><kbd>⌥</kbd> <kbd>⌥</kbd> then drag, in any app</p>
  </div>
  <img class="get" src="../docs/images/answer.svg" alt="">
</body>
</html>
