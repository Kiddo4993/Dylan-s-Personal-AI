[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fixel"
version = "0.1.0"
description = "Double-tap Right Option, screenshot anything, get unstuck."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["ai", "screenshot", "macos", "terminal", "claude", "gemini", "openai", "homework", "canvas", "ide"]
classifiers = [
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "anthropic>=1.0",
  "google-genai>=1.0",
  "openai>=1.0",
  "keyring>=25",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7",
  "pyobjc-framework-Quartz>=10.0",
  "pyobjc-framework-Vision>=10.0",
]

[project.urls]
Homepage = "https://github.com/Kiddo4993/Dylan-s-Personal-AI"
Issues = "https://github.com/Kiddo4993/Dylan-s-Personal-AI/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fixel = "fixel.__main__:main"

[tool.setuptools.packages.find]
include = ["fixel*"]

[tool.setuptools.package-data]
"fixel.playground" = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
