[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixel"
version = "0.1.0"
description = "Double-tap Right Option, screenshot anything, get unstuck."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "google-genai>=1.0",
  "keyring>=25",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7",
  "pyobjc-framework-Quartz>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fixel = "fixel.__main__:main"

[tool.setuptools.packages.find]
include = ["fixel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
